# Local development stack: PostgreSQL + API + scheduled job + web front end.
# Copy .env.example to .env first.

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
  FOOTBALL_DATA_ORG_API_KEY: ${FOOTBALL_DATA_ORG_API_KEY:-}
  FDUK_BOOKMAKERS: ${FDUK_BOOKMAKERS:-B365,PS,Avg,Max,BbAv,BbMx}
  SCHEDULE_INTERVAL_MINUTES: ${SCHEDULE_INTERVAL_MINUTES:-360}
  SCHEDULE_COMPETITIONS: ${SCHEDULE_COMPETITIONS:-PL}
  SCHEDULE_PROVIDERS: ${SCHEDULE_PROVIDERS:-football-data-uk,openfootball}
  SCHEDULE_RUN_EVALUATION: ${SCHEDULE_RUN_EVALUATION:-true}
  PREDICTION_STALE_HOURS: ${PREDICTION_STALE_HOURS:-48}
  DATA_STALE_HOURS: ${DATA_STALE_HOURS:-48}
  EVALUATION_SEASONS: ${EVALUATION_SEASONS:-3}
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: ${LOG_JSON:-true}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  scheduler:
    build: ./backend
    command: ["python", "-m", "app.cli", "scheduler"]
    environment: *backend-env
    depends_on:
      api:
        condition: service_healthy   # the api container applies migrations first

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:80"

volumes:
  pgdata:
